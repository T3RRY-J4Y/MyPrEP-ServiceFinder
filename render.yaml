services:
  - type: web
    name: myprep-servicefinder
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    # React Router: rewrite all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Environment variables — set real values in the Render dashboard
    # (Dashboard → your site → Environment → Add environment variable)
    # Never commit real keys here.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false   # Render will prompt you to enter this value
      - key: VITE_SUPABASE_ANON_KEY
        sync: false   # Render will prompt you to enter this value

    # Auto-deploy every time you push to main
    autoDeploy: true
